name: Deploy Documentation



on: 
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"

  pull_request:
    branches:
      - main
  
  workflow_dispatch: # Manual trigger for tests


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-git-revision-date-localized-plugin mkdocs-material mkdocs-minify-plugin pymdown-extensions

      - name: Build documentation
        run: |
          mkdocs build --strict

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
    
  deploy-pages:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4