name: Deploy Documentation



on: 
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "docs/mkdocs.yml"

  pull_request:
    branches:
      - master
  
  workflow_dispatch: # Manual trigger for tests


permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 #fetch all commit history

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-git-revision-date-localized-plugin mkdocs-material mkdocs-minify-plugin mkdocs-awesome-pages-plugin pymdown-extensions mkdocstrings[python]>=0.18

      - name: Build documentation
        run: |
          mkdocs build -f docs/mkdocs.yml 

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
  deploy-page:
      
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4