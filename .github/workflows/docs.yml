name: Deploy Documentation



on: 
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "docs/mkdocs.yml"

  pull_request:
    branches:
      - master
  
  workflow_dispatch: # Manual trigger for tests


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-git-revision-date-localized-plugin mkdocs-material mkdocs-minify-plugin mkdocs-awesome-pages-plugin pymdown-extensions

      - name: Build documentation
        run: |
          mkdocs build -f docs/mkdocs.yml --strict

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
  deploy-page:
      runs-on: ubuntu-latest
      needs: build                  # only runs if build passes
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - uses: actions/setup-python@v5
          with:
            python-version: '3.x'
            cache: pip

        - name: Install dependencies
          run: pip install mkdocs mkdocs-git-revision-date-localized-plugin mkdocs-material mkdocs-minify-plugin mkdocs-awesome-pages-plugin pymdown-extensions

        - name: Deploy to GitHub Pages
          run: mkdocs gh-deploy --force -f docs/mkdocs.yml