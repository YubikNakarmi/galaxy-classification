name: Tests
on: 
  pull_request:
    branches: ["master"]
    paths:
      - tests/**
      

jobs:

  integration-tests:
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite #simulation using local azurite on ci run
        ports: ["10000:10000"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with: 
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12 
     

      - run: uv sync --frozen --all-extras
      - run: pytest -v tests
        