name: Build and Upload Helm Chart
on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master
    
    paths:
        - "infra/helm/**"
  pull_request:
    branches:
      - master
    paths:
        - "infra/helm/**"

permissions:
  contents: read
  packages: write

jobs: 
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0 #fetch all commit history

            - name: Set up Helm
              uses: azure/setup-helm@v5
              with:
                version: latest

            - name: Lint & validate Helm Chart
              run: |
                helm lint infra/helm/galaxy-classification
                helm template infra/helm/galaxy-classification
            
            - name: Package Helm Chart
              run: helm package infra/helm/galaxy-classification
            
            - name: login
              run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Upload Helm Chart artifact
              run: |
                VERSION=${GITHUB_REF_NAME#v}
                helm package inra/helm/galaxy-classification --version $VERSION
                helm push galaxy-classification-$VERSION.tgz oci://ghcr.io/${{ github.repository_owner }}/galaxy-classification

            