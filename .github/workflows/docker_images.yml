name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # results in ghcr.io/<owner>/<repo>

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'   
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  build-and-push-bentoml:

    runs-on: ubuntu-latest
    permissions: 
      packages: write
      contents: read
    
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bentoml
          pip install -r bentoml_api/requirements.bentoml.txt

      - name: Build Bento
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          bentoml build --version "$VERSION"
         
       
      - name: Build Image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          bentoml containerize galaxy_classification:$VERSION \
          --image-tag ghcr.io/${{ github.repository }}-bento:$VERSION
          --image-tag ghcr.io/${{ github.repository }}-bento:latest
          
      - name: Push Bento container
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker push ghcr.io/${{ github.repository }}-bento:$VERSION
          docker push ghcr.io/${{ github.repository }}-bento:latest

      
