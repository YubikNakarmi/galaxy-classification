name: Build and Push Docker Image

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master"]

  workflow_dispatch: 
    inputs: 
      version:
        description: 'Version to build and push'
        required: true
        default: 'latest'
        type: string

      only_bentoml:
        description: 'Build and push only the BentoML image'
        required: false
        default: true
        type: boolean
        

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # results in ghcr.io/<owner>/<repo>


jobs:

  build-and-push:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only_bentoml != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'   
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set version Dispatch
        if: github.event_name == 'workflow_dispatch' 
        run: echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
      - name: Set version Tag
        if: github.event_name != 'workflow_dispatch'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/yubiknakarmi/galax-api:${{env.VERSION}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
  build-and-push-bentoml:

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.only_bentoml == true }}
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra bentoml

      - name: Set version Dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Set version Tag
        if: github.event_name != 'workflow_dispatch'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Bento
        run: uv run bentoml build --version "$VERSION"

      - name: Build Bento Image
        run: |
          uv run bentoml containerize galaxy_classification:"$VERSION" \
            --image-tag ghcr.io/${{ github.repository }}-bento:"$VERSION"

      - name: Push Bento Image
        run: |
          docker push ghcr.io/${{ github.repository }}-bento:"$VERSION"