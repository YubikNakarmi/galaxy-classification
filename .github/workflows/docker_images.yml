name: Build and Push Docker Image

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master"]

  workflow_dispatch: 
    inputs: 
      version:
        description: 'Version to build and push'
        required: true
        default: 'latest'
        type: string

    

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # results in ghcr.io/<owner>/<repo>

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'   
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set version Dispatch
        if: github.event_name == 'workflow_dispatch' 
        run: echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
      - name: Set version Tag
        if: github.event_name != 'workflow_dispatch'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/yubiknakarmi/galax-api:${{env.VERSION}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
  build-and-push-bentoml:

    runs-on: ubuntu-latest
    permissions: 
      packages: write
      contents: read
    
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bentoml
          pip install -r bentoml_api/requirements.bentoml.txt
      - name: Set version Dispatch
        if: github.event_name == 'workflow_dispatch' 
        run: echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
      - name: Set version Tag
        if: github.event_name != 'workflow_dispatch'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build Bento
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          bentoml build --version ${{env.VERSION}}
         
       
      - name: Build Image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          bentoml containerize galaxy_classification:${{env.VERSION}} \
          --image-tag ghcr.io/${{ github.repository }}-bento:${{env.VERSION}} \
          
      - name: Push Bento container
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker push ghcr.io/${{ github.repository }}-bento:${{env.VERSION}}

      
