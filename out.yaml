# Source: galaxy-classification/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: galaxy
  labels:
    app: fast-api
    version: v1
    tier: backend

spec:

  replicas: 3
  revisionHistoryLimit: 10 #10 hsitory after update

  selector:
    matchLabels:
      app: fast-api
      tier: backend
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1


  #pods definition
  template:
    metadata:
      labels:
        app: fast-api
        tier: backend

    spec:

      containers:
      - name: api
        image: ghcr.io/yubiknakarmi/galax-api:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000

        readinessProbe: #check if pod is ready to serve 
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

        command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 200m
            memory: 400Mi

        #secrets set from CLI, need to use vault for real deployment as it is non encrypted    
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: api-secret
                key: DATABASE_URL
                
          - name: AZURE_STORAGE_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: azure-secret
                key: AZURE_STORAGE_CONNECTION_STRING

          - name: BACKEND_YAML_PATH #explicitly set path to config to get form config map
            value: /app/configs/backend.yaml
        

        volumeMounts:
        - name: backend-config
          mountPath: /app/configs/backend.yaml
          subPath: backend.yaml #donot hide existing

      volumes: 
        - name: backend-config #mount volume from configmap for auto set config (need to restart the api)
          configMap:
            name: backend-config
            items: 
              - key: backend.yaml 
                path: backend.yaml #save to same path in config/app/backend.yaml
        
        

      
---
# Source: galaxy-classification/templates/bentoml-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name:  bentoml-deployment
  namespace: galaxy
  labels:
    app:  bentoml-deployment
    
spec:
  selector:
    matchLabels:
      app: bentoml-deployment
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate

  template:
    metadata:
      labels:
        app:  bentoml-deployment
    spec:
  
      containers:
      - name:  bentoml
        image: ghcr.io/yubiknakarmi/galax-bentoml:v1.1.0  #no restart policy set set if needed

        resources:
          requests:
            cpu: 250m
            memory: 400Mi
          limits:
            cpu: 1000m
            memory: 1000Mi
      
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10


        env:
          #set secrets from secretmaps
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: host

        - name: MLFLOW_USERNAME
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: username

        - name: MLFLOW_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: password
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: azure-secrets  #needed for uploading of models during training
              key: connection-string

        #explictly set config paths so it resolves in container
    
        - name: BACKEND_YAML_PATH
          value: /home/bentoml/bento/src/configs/backend.yaml

        - name: ML_YAML_PATH
          value: /home/bentoml/bento/src/configs/ml.yaml

        - name: CORE_YAML_PATH
          value: /home/bentoml/bento/src/configs/core.yaml

        ports:
        - containerPort:  3000
          name:  bentoml-port

        #mount configs
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime

        - name: backend-config
          mountPath: /home/bentoml/bento/src/configs/backend.yaml
          subPath: backend.yaml

        - name: core-config
          mountPath: /home/bentoml/bento/src/configs/core.yaml
          subPath: core.yaml

        - name: ml-config
          mountPath: /home/bentoml/bento/src/configs/ml.yaml
          subPath: ml.yaml
        
        - name: models
          mountPath: /home/bentoml/bento/src/models/cache
          readOnly: false

      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/Asia/Kathmandu
        
        - name: models
          hostPath: 
            path: ./models/cache
            type: DirectoryOrCreate

      #configs
        - name: backend-config
          configMap:
            name: backend-config
            items:
              - key: backend.yaml
                path: backend.yaml

        - name: core-config
          configMap:
            name: core-config
            items:
              - key: core.yaml
                path: core.yaml

        - name: ml-config
          configMap:
            name: ml-config
            items:
              - key: ml.yaml
                path: ml.yaml

      restartPolicy: Always
---
# Source: galaxy-classification/templates/redis-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-deployment
  template:
    metadata:
      labels:
        app: redis-deployment

    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        imagePullPolicy: IfNotPresent

        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379

        #healthchecks
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10

        #helm if statment
        volumeMounts:
        - name: redis-storage #mount to redis pvc
          mountPath: /data
      volumes:
      - name: redis-storage
        persistentVolumeClaim: #persist redis data
          claimName: redis-pvc
