
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: galaxy-classification-api
  namespace: {{ .Release.Namespace }}
{{- if .Values.ingress.enabled }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8000
                  
          - path: /classification
            pathType: Prefix
            backend:
              service:
                name: bentoml-service
                port:
                  number: 3000
{{- end }}