apiVersion: apps/v1
kind: Deployment
metadata:
  name:  bentoml-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app:  bentoml-deployment
    
spec:
  selector:
    matchLabels:
      app: bentoml-deployment
  replicas: {{.Values.bentoml.replicaCount}}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate

  template:
    metadata:
      labels:
        app:  bentoml-deployment
    spec:
  
      containers:
      - name:  bentoml
        image: {{.Values.bentoml.image.repository}}:{{.Values.bentoml.image.tag}}  #no restart policy set set if needed

        resources:
          requests:
            cpu: {{.Values.bentoml.resources.requests.cpu}}
            memory: {{.Values.bentoml.resources.requests.memory}}
          limits:
            cpu: {{.Values.bentoml.resources.limits.cpu}}
            memory: {{.Values.bentoml.resources.limits.memory}}
      
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10


        env:
          #set secrets from secretmaps
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: host

        - name: MLFLOW_USERNAME
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: username

        - name: MLFLOW_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: password
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: azure-secrets  #needed for uploading of models during training
              key: connection-string

        #explictly set config paths so it resolves in container
    
        - name: BACKEND_YAML_PATH
          value: {{.Values.bentoml.configs.BACKEND_YAML_PATH}}

        - name: ML_YAML_PATH
          value: {{.Values.bentoml.configs.ML_YAML_PATH}}

        - name: CORE_YAML_PATH
          value: {{.Values.bentoml.configs.CORE_YAML_PATH}}

        ports:
        - containerPort:  3000
          name:  bentoml-port

        #mount configs
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime

        - name: backend-config
          mountPath: {{ .Values.bentoml.configs.BACKEND_YAML_PATH }}
          subPath: backend.yaml

        - name: core-config
          mountPath: {{ .Values.bentoml.configs.CORE_YAML_PATH }}
          subPath: core.yaml

        - name: ml-config
          mountPath: {{ .Values.bentoml.configs.ML_YAML_PATH }}
          subPath: ml.yaml
        
        - name: models
          mountPath: /home/bentoml/bento/src/models/cache
          readOnly: false

      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/Asia/Kathmandu
        
        - name: models
          hostPath: 
            path: {{ .Values.globalVolumes.host.models }}
            type: DirectoryOrCreate

      #configs
        - name: backend-config
          configMap:
            name: backend-config
            items:
              - key: backend.yaml
                path: backend.yaml

        - name: core-config
          configMap:
            name: core-config
            items:
              - key: core.yaml
                path: core.yaml

        - name: ml-config
          configMap:
            name: ml-config
            items:
              - key: ml.yaml
                path: ml.yaml

      restartPolicy: Always