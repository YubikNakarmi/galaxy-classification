
globalVolumes:
  host:
    models: ./models/cache
    

api: 
  replicaCount: 3
  image:
    repository: ghcr.io/yubiknakarmi/galax-api
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources: 
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 400Mi
  
  service: 
    port: 8000

  env:
    ML_CONFIG_PATH: /app/configs/ml.yaml
    BACKEND_CONFIG_PATH: /app/configs/backend.yaml
    CORE_CONFIG_PATH: /app/configs/core.yaml


bentoml:
  replicaCount: 3

  image:
    repository: ghcr.io/yubiknakarmi/galax-bentoml
    tag: v1.1.0
  service:
    port: 3000

  resources:
    requests:
      cpu: 250m
      memory: 400Mi
    limits:
      cpu: 1000m
      memory: 1000Mi

  configs: #used both in env and also volume mount for some soure of truth
    BACKEND_YAML_PATH: /home/bentoml/bento/src/configs/backend.yaml
    ML_YAML_PATH: /home/bentoml/bento/src/configs/ml.yaml
    CORE_YAML_PATH: /home/bentoml/bento/src/configs/core.yaml


redis: 
  enabled: true
  persistence:
    enabled: true
    size: 5Gi

ingress: 
  enabled: true
  
jobs:
  training:
    enabled: false