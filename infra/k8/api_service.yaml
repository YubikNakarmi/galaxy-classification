apiVersion: v1 
kind: Service
metadata:
  name: api-service
  namespace: default
spec:
  selector:
    app: fast-api
    
  type: ClusterIP
  sessionAffinity: None
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - name: api-service
    protocol: TCP
    port: 8000
    targetPort: 8000
