
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: galaxy-classification-api
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: Api-service
                port:
                  number: 8000
 