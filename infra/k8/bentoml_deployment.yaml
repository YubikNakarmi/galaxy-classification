apiVersion: apps/v1
kind: Deployment
metadata:
  name:  bentoml-deployment
  namespace: default
  labels:
    app:  bentoml-deployment
spec:
  selector:
    matchLabels:
      app: bentoml-deployment
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate

  template:
    metadata:
      labels:
        app:  bentoml-deployment
    spec:
  
      containers:
      - name:  Bentoml
        image:  galaxy_classification:v0.1.0
        resources:
          requests:
            cpu: 100m
            memory: 400Mi
            gpu: 1
          limits:
            cpu: 100m
            memory: 500Mi
      
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 80
          initialDelaySeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        env:
        - name: ml
        ports:
        - containerPort:  3000
          name:  bentoml-port
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
      restartPolicy: Always