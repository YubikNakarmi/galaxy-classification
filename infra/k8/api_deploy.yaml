apiVersion: v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    app: fast-api
    version: v1
    tier: backend

spec:

  replicas: 3
  revisionHistoryLimit: 10 #10 hsitory after update

  selector:
    matchLabels:
      app: fast-api
      tier: backend
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1


  #pods definition
  template:
    metadata:
      labels:
        app: fast-api
        tier: backend

    spec:

      initContainers:
       
      - name: wait-for-db

        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: DB_SECRET
              key: db-password

        image: busybox:1.35.0
        command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done;']
        imagePullPolicy: IfNotPresent


      containers:
      - name: api
        image: galax-api:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000

      - name: prometheus
        image: prom/prometheus:v3.13.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090

      - name: loki
        image: grafana/loki:2.8.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3100
