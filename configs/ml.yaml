
dataset:

  split:
    - random_state: 42
    - test_size: 0.15
    - train_size: 0.7
    - val_size: 0.15
     
model:
  architecture: default
  pretrained: false
  num_classes: 5
  input_size: 128

  training:
    batch_size: 32
    num_epochs: 10
    learning_rate: 0.001
    weight_decay: 0.0001
    scheduler_step_size: 5
    scheduler_gamma: 0.1