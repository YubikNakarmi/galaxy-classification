#core.yaml
system:
  name: galaxy-classifier
  version: v0.8.0

runtime:
  mode: local   # local or cloud

cli:
    style:
      info: "bright_blue"
      success: "bold spring_green2"
      warning: "bold gold3"
      error: "bold deep_pink3"
      debug: "grey50"
      trace: "dim grey37"
      banner: "bold magenta"

cloud:
  azure:
    storage:
      connection_string: ${AZURE_STORAGE_CONNECTION_STRING}
      default_container: galaxy-experiments
        
ml:
  config_file: configs/ml.yaml
  


dirs:
  logs: 
    bentoml:
      service: logs/bentoml/service.log
      api: logs/bentoml/api.log
      ml: logs/bentoml/ml.log

  data: 
    raw: data/raw
    processed: data/processed
    images: images
    
  models: models
  artifacts: artifacts




  

# Only system logs like script execution, errors, etc. ML-specific logs (like training metrics) 
# will be handled separately under mlflow and in differnt files though ml.yaml configs.

logging: 
  app:
    level: INFO
    file: logs/system/app.log
    rotation: "10 MB"
    retention: "7 days"
    compression: zip
  
  ml:
    level: INFO
    file: logs/system/ml.log
    rotation: "10 MB"
    retention: "7 days"
    compression: zip

  cloud: #blob log upload from vm to blob periodocally
    type: azure-blob

    logs:
      frequency: daily
      container: galaxy-classification-logs
      app:
        
        dir: logs/system/app.log
        blob_dir: app/ #inside blob

      ml:
        dir: logs/system/ml.log
        blob_dir: ml/