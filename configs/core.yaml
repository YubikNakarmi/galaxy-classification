system:
  name: galaxy-classifier
  version: 1.0

runtime:
  mode: local   # local or cloud

ml:
  config_file: configs/ml.yaml


storage:
  azure:
    connection_string: ${AZURE_STORAGE_CONNECTION_STRING}
    container_name: ${AZURE_CONTAINER_NAME}

  mysql:
    url: ${MYSQL_URL}

logging:

  app:
    level: INFO
    file: logs/system/app.log
    rotation: "10 MB"
    retention: "7 days"
    compression: zip
  
  ml:
    level: INFO
    file: logs/system/ml.log
    rotation: "10 MB"
    retention: "7 days"
    compression: zip