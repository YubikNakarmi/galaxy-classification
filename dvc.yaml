stages:
  preprocess:
    cmd: python ml/preprocess.py --run_preprocessing true --run_split true
    deps:
      - ml/preprocess.py
      - ml/variants.yaml
      - data/raw/mapping.csv
      - data/raw/labels.csv
    outs:
      - data/preprocessed/
     
  train:
    cmd: python ml/train.py
    deps:
      - ml/train.py
      - ml/variants.yaml
      - data/preprocessed/
    outs:
      - models/
    params:
      - configs/ml.yaml :
          - variants.Default
          - variants.Hubble
          - variants.Dirichlet
          - params

  evaluate:
    cmd: python ml/evaluate.py
    deps:
      - ml/evaluate.py
      - ml/variants.yaml
      - data/preprocessed/
      - models/
    outs:
      - evaluation/