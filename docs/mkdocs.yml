site_name: Galaxy CNN Classifier
site_description: CNN-based galaxy classification project with training, evaluation, and MLOps pipeline
site_author: Yubik Nakarmi

repo_url: https://github.com/YubikNakarmi/galaxy-classification
repo_name: GitHub

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

  - mkdocs-jupyter:
      include_source: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - assets/css/extra.css

nav:
  - Home: index.md

  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Project Structure: getting-started/project-structure.md
      - Configuration: getting-started/configuration.md

  - Dataset:
      - Overview: dataset/overview.md
      - Galaxy Zoo 2: dataset/galaxy-zoo-2.md
      - Preprocessing: dataset/preprocessing.md
      - Augmentations: dataset/augmentations.md
      - Splitting Strategy: dataset/splitting-strategy.md

  - Models:
      - Overview: models/overview.md
      - Baseline CNN: models/baseline-cnn.md
      - ResNet: models/resnet.md
      - EfficientNet: models/efficientnet.md
      - Vision Transformer: models/vision-transformer.md

  - Training:
      - Pipeline: training/training-pipeline.md
      - Hyperparameters: training/hyperparameters.md
      - Optimization: training/optimization.md
      - Schedulers: training/schedulers.md
      - Distributed Training: training/distributed-training.md

  - Experiments:
      - Tracking: experiments/experiment-tracking.md
      - Ablation Studies: experiments/ablation-studies.md
      - Benchmarks: experiments/benchmark-results.md

  - Evaluation:
      - Metrics: evaluation/metrics.md
      - Confusion Matrix: evaluation/confusion-matrix.md
      - Error Analysis: evaluation/error-analysis.md

  - MLOps:
      - DVC: mlops/dvc.md
      - MLflow: mlops/mlflow.md
      - Docker: mlops/docker.md
      - CI/CD: mlops/ci-cd.md
      - Deployment: mlops/deployment.md

  - API:
      - Inference API: api/inference-api.md
      - CLI: api/cli.md
      - Schemas: api/schemas.md

  - Research:
      - Literature Review: research/literature-review.md
      - Future Work: research/future-work.md

  - Tutorials:
      - Fine-tuning: tutorials/fine-tuning.md
      - Training Custom Model: tutorials/training-custom-model.md

  - Reference:
      - Glossary: reference/glossary.md
      - Module Reference: reference/module-reference.md