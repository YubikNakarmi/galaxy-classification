site_name: CosmosClassifier
site_description: End-to-end ML/MLOps pipeline for astronomical image classification
site_author: Your Name
site_url: https://YubikNakarmi.github.io/cosmos-classifier
repo_url: https://github.com/YubikNakarmi/galaxy-classification
repo_name: Galaxy Classification
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Interc:\Users\ZENBOOK\Downloads\cosmos-docs
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.png
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YubikNakarmi/galaxy-classification
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/yubiknakarmi
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  generator: false

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md

  - Getting started:
    - getting-started/index.md
    - Prerequisites: getting-started/prerequisites.md
    - Quick start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
    - Running locally: getting-started/running-locally.md

  - Architecture:
    - architecture/index.md
    - System overview: architecture/overview.md
    - Async classification flow: architecture/async-flow.md
    - Database schema: architecture/database.md
    - Service topology: architecture/services.md

  - Data:
    - data/index.md
    - Galaxy Zoo dataset: data/galaxy-zoo.md
    - Label processing: data/label-processing.md
    - Data preprocessing: data/preprocessing.md
    - Data augmentation: data/augmentation.md
    - Class imbalance handling: data/class-imbalance.md  

  - ML:
    - ml/index.md
    - Model (EfficientNetB3): ml/model.md
    - Training loop: ml/training.md
    - Evaluation & metrics: ml/evaluation.md
    - Grad-CAM explainability: ml/gradcam.md

  - API reference:
    - api/index.md
    - Authentication: api/auth.md
    - Classification: api/classify.md
    - History: api/history.md
    - WebSocket: api/websocket.md

  - MLOps:
    - mlops/index.md
    - DVC data versioning: mlops/dvc.md
    - MLflow experiment tracking: mlops/mlflow.md
    - Model registry & promotion: mlops/registry.md
    - BentoML inference service: mlops/bentoml.md
    - Drift monitoring (Evidently): mlops/drift.md

  - Infrastructure:
    - infra/index.md
    - Docker Compose: infra/docker-compose.md
    - CI/CD (GitHub Actions): infra/cicd.md
    - Prometheus & Grafana: infra/observability.md

  - Deployment:
    - deployment/index.md
    - Azure VM: deployment/azure.md
