site_name: Galaxy Classification
site_description: End-to-end ML/MLOps pipeline for astronomical image classification
site_author: Yubik Nakarmi
site_url: https://yubiknakarmi.github.io/galaxy-classification
repo_url: https://github.com/YubikNakarmi/galaxy-classification
repo_name: Galaxy Classification
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  logo: assets/favicon.png
  favicon: assets/favicon.png

  font:
    text: Inter
    code: JetBrains Mono
  
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - content.action.edit
    - content.action.view
    - navigation.footer
    - navigation.hide 
    - content.code.copy


plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      enable_git_follow: false
  - bibtex: 
      bib_file: docs/references.bib
      

  - mkdocstrings:
      handlers:
        python:
          paths: ["..", "../src"]
          options:
            show_root_heading: true
            filters: ["!^__"]
            docstring_style: google
            docstring_section_style: spacy   # or "table"/"list" 
            merge_init_into_class: true

  - awesome-pages


markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji
  - pymdownx.blocks.caption
  - toc:
      permalink: true
      title: On this page
      toc_depth: 2
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YubikNakarmi/galaxy-classification
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/yubiknakarmi
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  generator: false

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/mathjax.js
  - assets/extra.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

