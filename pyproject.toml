
[project]
name = "galaxy-classification"
version = "v0.6.0"
description = "A package which everything to run galaxy classification"
authors = [{name = "Yubik Nakarmi"}]
license = "MIT"
readme = "README.md"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/yubik/galaxy-classification"
Repository = "https://github.com/yubik/galaxy-classification.git"

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]


dependencies = [
     "torch>=2.12,<3",
    "torchvision>=0.27,<1",
    "numpy>=2.4,<3",
    "pandas>=2.3,<3",
    "scikit-learn>=1.8,<2",
    "matplotlib>=3.10,<4",
    "opencv-python>=4.13,<5",

    "fastapi>=0.136,<1",
    "uvicorn>=0.47,<1",
    "pydantic>=2.13,<3",

    "mlflow>=3.13,<4",
    "bentoml>=1.4,<2",
    "dvc>=3.67,<4",
    "dvc-azure>=3.1,<4",

    "azure-storage-blob>=12.29,<13",
    "azure-identity>=1.25,<2",

    "hydra-core>=1.3,<2",
    "loguru>=0.7,<1",
    "python-dotenv>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["src", 
            "src.*",
            "ml",
            "ml.*",]

[project.scripts]
galax = "ml.cli:cli"