
services:

  api:
    build: .
    container_name: /infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: uvicorn api/main:app --host

  grafana:
    image: grafana/grafana:13.1.0
    container_name: grafana
    ports:
      - "3001:3000" #avoid conflict with bentoml
    env_file:
      - .env
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus #pth inside container
    
  redis:
      image: redis:7-alpine
      command: redis-server --appendonly yes
      ports:
      - "6379:6379"
      volumes:
        - redis-data:/data
        
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 30s
        retries: 50
        start_period: 30s
      restart: always
  
  bentoml:
    image: galaxy_classification:v0.6.0 #built bento container using bentoml build

    env_file:
      - .env
    volumes:
      - ./bentoml:/bentoml
      - ./bentoml_api:/home/bentoml/bento/src/bentoml_api
      - ./src:/home/bentoml/bento/src/src #mount for editable files without building
      - ./logs/bentoml:/home/bentoml/bento/src/logs/system/
      - ./models/cached:/home/bentoml/bento/src/models/cached #mount cached for presistance


    container_name: bentoml
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      LOG_JSON: ${LOG_JSON}
    ports:
      - "3000:3000"
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.13.0-full
    container_name: mlflow
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
        MYSQLURL_REMOTE: ${MYSQLURL_REMOTE}
        MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}
    
      
    command: >    #mlflow db upgrade \"${MYSQLURL_REMOTE}\" &&
         mlflow server
          --backend-store-uri ${MYSQLURL_REMOTE}
          --default-artifact-root ${MLFLOW_ARTIFACT_ROOT}
          --host 0.0.0.0
          --port 5000
          --allowed-hosts "*"
          
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  azureite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azureite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"

  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: tensorboard
    ports:
      - "6006:6006"
    volumes:
      - ./data/ml/tensorboard/experiment_1:/tensorboard
    command: tensorboard --logdir=/tensorboard --host=0.0.0.0


volumes:
  prometheus_data:
  redis-data:
  grafana_data: