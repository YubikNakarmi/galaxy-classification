
services:

  api:
    build: .
    container_name: /infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: uvicorn api/main:app --host
    
  redis:
      image: redis:latest
      command: redis-server --appendonly yes
      ports:
      - "6379:6379"
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 30s
        retries: 50
        start_period: 30s
      restart: always
  
  bentoml:
    build: ./bentoml
    volumes:
      - ./bentoml:/bentoml
    command: bentoml serve bentoml.service:GalaxyClassification --reload
    ports:
      - "3000:3000"
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.13.0-full
    container_name: mlflow
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
        MYSQLURL_REMOTE: ${MYSQLURL_REMOTE}
        MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}
    
      
    command: >    #mlflow db upgrade \"${MYSQLURL_REMOTE}\" &&
         mlflow server
          --backend-store-uri ${MYSQLURL_REMOTE}
          --default-artifact-root ${MLFLOW_ARTIFACT_ROOT}
          --host 0.0.0.0
          --port 5000
          --allowed-hosts "*"
          
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
  
  azureite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azureite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"

  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: tensorboard
    ports:
      - "6006:6006"
    volumes:
      - ./data/ml/tensorboard/experiment_1:/tensorboard
    command: tensorboard --logdir=/tensorboard --host=



    