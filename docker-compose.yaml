

services:

  api:
    build: .
    container_name: /infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: uvicorn api/main:app --host
    
  redis:
      command: redis-server --appendonly yes
      ports:
      - "6379:6379"
      volumes:
        - redisdata:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 30s
        retries: 50
        start_period: 30s
      restart: always
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    container_name: mlflow
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command:
      - mlflow db upgrade "${MYSQLURL_REMOTE}" &&
        mlflow server
        --backend-store-uri "${MYSQLURL_REMOTE}"
        --default-artifact-root "${MLFLOW_ARTIFACT_ROOT}"
        --host 0.0.0.0
        --allowed-hosts "*"
        --port 5000
  
  azureite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azureite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000"
    