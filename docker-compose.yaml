

services:
  redis:
      image: redis:7.2-bookworm
      expose:
        - 6379
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 30s
        retries: 50
        start_period: 30s
      restart: always
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    container_name: mlflow
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command:
      - mlflow db upgrade "${MYSQLURL_REMOTE}" &&
        mlflow server
        --backend-store-uri "${MYSQLURL_REMOTE}"
        --default-artifact-root "${MLFLOW_ARTIFACT_ROOT}"
        --host 0.0.0.0
        --allowed-hosts "*"
        --port 5000